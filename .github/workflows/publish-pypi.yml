name: Publish SDK to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "构建的分支或标签；首次发布选择 main"
        required: true
        default: main
        type: string
      publish:
        description: "发布到 PyPI（未勾选时只构建验证）"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pypi-sdk-${{ github.event.release.tag_name || inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - name: Check release tag matches the SDK version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -c "import os, tomllib; from packaging.version import Version; version=tomllib.load(open('pyproject.toml','rb'))['project']['version']; tag=os.environ.get('RELEASE_TAG'); assert not tag or Version(tag)==Version(version), 'Release tag and SDK version differ'"
      - run: python -m build --outdir dist/pypi
      - run: python scripts/check_sdk_distribution.py dist/pypi
      - run: python -m twine check dist/pypi/*
      - run: python -m pip install --no-deps --force-reinstall dist/pypi/*.whl
      - run: python -I scripts/check_sdk_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-sdk-distributions
          path: dist/pypi/*
          retention-days: 7

  publish:
    if: github.event_name == 'release' || inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/czn-deckcode
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-sdk-distributions
          path: dist/pypi
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi
