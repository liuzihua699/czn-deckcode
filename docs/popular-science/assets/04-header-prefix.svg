<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030">
<title>为什么这些码都以 v6l8 开头？</title>
<desc>BP4 的固定头与固定掩码，先产生相同的三个字节。</desc>
<style>text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker></defs>
<rect x="0" y="0" width="1200" height="1030" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="64" y="43" font-size="18" fill="#2563eb" text-anchor="start" font-weight="700">CZN / BP4 图解</text>
<text x="64" y="91" font-size="34" fill="#111827" text-anchor="start" font-weight="700">为什么这些码都以 v6l8 开头？</text>
<text x="64" y="132" font-size="22" fill="#566176" text-anchor="start" font-weight="400">BP4 的固定头与固定掩码，先产生相同的三个字节。</text>
<text x="64" y="248" font-size="26" fill="#111827" text-anchor="start" font-weight="700">BP4 格式头</text>
<rect x="330" y="187" width="180" height="94" rx="12" fill="#eff6ff" stroke="#d5deed" stroke-width="1.5"/>
<text x="420" y="249" font-size="40" fill="#2563eb" text-anchor="middle" font-weight="700">42</text>
<rect x="570" y="187" width="180" height="94" rx="12" fill="#eff6ff" stroke="#d5deed" stroke-width="1.5"/>
<text x="660" y="249" font-size="40" fill="#2563eb" text-anchor="middle" font-weight="700">50</text>
<rect x="810" y="187" width="180" height="94" rx="12" fill="#eff6ff" stroke="#d5deed" stroke-width="1.5"/>
<text x="900" y="249" font-size="40" fill="#2563eb" text-anchor="middle" font-weight="700">04</text>
<text x="64" y="381" font-size="26" fill="#111827" text-anchor="start" font-weight="700">掩码前三字节</text>
<rect x="330" y="320" width="180" height="94" rx="12" fill="#f8fafc" stroke="#d5deed" stroke-width="1.5"/>
<text x="420" y="382" font-size="40" fill="#2563eb" text-anchor="middle" font-weight="700">fd</text>
<rect x="570" y="320" width="180" height="94" rx="12" fill="#f8fafc" stroke="#d5deed" stroke-width="1.5"/>
<text x="660" y="382" font-size="40" fill="#2563eb" text-anchor="middle" font-weight="700">f9</text>
<rect x="810" y="320" width="180" height="94" rx="12" fill="#f8fafc" stroke="#d5deed" stroke-width="1.5"/>
<text x="900" y="382" font-size="40" fill="#2563eb" text-anchor="middle" font-weight="700">78</text>
<text x="64" y="514" font-size="26" fill="#2563eb" text-anchor="start" font-weight="700">逐字节 XOR</text>
<rect x="330" y="453" width="180" height="94" rx="12" fill="#f5f0ff" stroke="#d5deed" stroke-width="1.5"/>
<text x="420" y="515" font-size="40" fill="#7c3aed" text-anchor="middle" font-weight="700">bf</text>
<rect x="570" y="453" width="180" height="94" rx="12" fill="#f5f0ff" stroke="#d5deed" stroke-width="1.5"/>
<text x="660" y="515" font-size="40" fill="#7c3aed" text-anchor="middle" font-weight="700">a9</text>
<rect x="810" y="453" width="180" height="94" rx="12" fill="#f5f0ff" stroke="#d5deed" stroke-width="1.5"/>
<text x="900" y="515" font-size="40" fill="#7c3aed" text-anchor="middle" font-weight="700">7c</text>
<path d="M 660 557 L 660 618" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="702" y="575" width="170.046875" height="34" rx="4" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="710" y="600" font-size="22" fill="#566176" text-anchor="start" font-weight="400">重新按 6 位分组</text>
<text x="64" y="660" font-size="26" fill="#111827" text-anchor="start" font-weight="700">24 位二进制 → 四组 6 位 → 四个 Base64url 字符</text>
<rect x="64" y="700" width="232" height="170" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="180" y="743" font-size="29" fill="#2563eb" text-anchor="middle" font-weight="400">101111</text>
<text x="180" y="783" font-size="21" fill="#566176" text-anchor="middle" font-weight="400">字符表序号 47</text>
<text x="180" y="842" font-size="42" fill="#7c3aed" text-anchor="middle" font-weight="700">v</text>
<rect x="344" y="700" width="232" height="170" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="460" y="743" font-size="29" fill="#2563eb" text-anchor="middle" font-weight="400">111010</text>
<text x="460" y="783" font-size="21" fill="#566176" text-anchor="middle" font-weight="400">字符表序号 58</text>
<text x="460" y="842" font-size="42" fill="#7c3aed" text-anchor="middle" font-weight="700">6</text>
<rect x="624" y="700" width="232" height="170" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="740" y="743" font-size="29" fill="#2563eb" text-anchor="middle" font-weight="400">100101</text>
<text x="740" y="783" font-size="21" fill="#566176" text-anchor="middle" font-weight="400">字符表序号 37</text>
<text x="740" y="842" font-size="42" fill="#7c3aed" text-anchor="middle" font-weight="700">l</text>
<rect x="904" y="700" width="232" height="170" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="1020" y="743" font-size="29" fill="#2563eb" text-anchor="middle" font-weight="400">111100</text>
<text x="1020" y="783" font-size="21" fill="#566176" text-anchor="middle" font-weight="400">字符表序号 60</text>
<text x="1020" y="842" font-size="42" fill="#7c3aed" text-anchor="middle" font-weight="700">8</text>
<rect x="64" y="908" width="1072" height="62" rx="12" fill="#f5f0ff" stroke="#ddd6fe" stroke-width="1.5"/>
<text x="600" y="950" font-size="24" fill="#111827" text-anchor="middle" font-weight="400">v6l8 表明共同的格式开头；角色编号要到解压后才出现。</text>
<text x="64" y="996" font-size="20" fill="#566176" text-anchor="start" font-weight="400">Base64url 是把二进制换成文字的表示方式，本身不压缩数据。</text>
</svg>
