[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "czn-deckcode"
version = "0.1.0a2"
description = "Offline deck-code tools for Chaos Zero Nightmare"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.optional-dependencies]
desktop = ["Pillow>=10,<14"]

[project.scripts]
czn-deckcode = "czn_deckcode.cli:main"

[project.gui-scripts]
czn-deckcode-desktop = "czn_deckcode.ui:main"

[project.urls]
Homepage = "https://github.com/liuzihua699/czn-deckcode"
Repository = "https://github.com/liuzihua699/czn-deckcode"
Issues = "https://github.com/liuzihua699/czn-deckcode/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["czn_deckcode*"]

[tool.setuptools.package-data]
czn_deckcode = ["py.typed", "assets/*.json", "assets/*.txt", "assets/cards/*.png", "assets/characters/*.png"]
